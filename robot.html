        tl.to(robotRoot.rotation, { y: 0.0, z: 0, duration: 0.32, ease: 'power2.out' }, 0)
          .to(headGroup.rotation, { x: -0.10, y: 0.0, z: -0.24, duration: 0.35, ease: 'back.out(2)' }, 0)
          .to([leftEye.scale, rightEye.scale], { x: 1.38, y: 1.42, duration: 0.3, ease: 'back.out(2.2)' }, 0.04)
          // Anticipación: pequeña flexión antes de levantar los brazos y saltar
          .to(robotRoot.position, { y: 0.14, duration: 0.28, ease: 'power2.in' }, 0.12)
          .to(torsoGroup.rotation, { x: 0.18, duration: 0.28, ease: 'power2.in' }, 0.12)
          .to([rightHip.rotation, leftHip.rotation], { x: -0.68, duration: 0.28 }, 0.12)
          .to([rightKnee.rotation, leftKnee.rotation], { x: 1.18, duration: 0.28 }, 0.12)
          .to([rightAnkle.rotation, leftAnkle.rotation], { x: 0.42, duration: 0.28 }, 0.12);

        // 3. Levanta ambos brazos progresivamente + 4. Realiza un salto de emoción + 5. Abre los brazos ampliamente
        tl.call(() => spawnCelebrationVFX(1.0), null, 0.40)
          .to(robotRoot.position, { y: 0.92, duration: 0.42, ease: 'power2.out' }, 0.40)
          .to(torsoGroup.rotation, { x: -0.22, duration: 0.42, ease: 'back.out(1.6)' }, 0.40)
          .to(headGroup.rotation, { x: -0.24, z: 0.08, duration: 0.40, ease: 'back.out(1.6)' }, 0.40)
          // Brazos se abren ampliamente en V de euforia
          .to(rightShoulder.rotation, { x: -0.32, y: -0.25, z: -2.42, duration: 0.42, ease: 'back.out(1.8)' }, 0.36)
          .to(leftShoulder.rotation, { x: -0.32, y: 0.25, z: 2.42, duration: 0.42, ease: 'back.out(1.8)' }, 0.36)
          .to([rightElbow.rotation, leftElbow.rotation], { x: -0.22, y: 0, z: 0, duration: 0.38 }, 0.38)
          .to([rightWrist.rotation, leftWrist.rotation], { x: -0.25, z: 0, duration: 0.38 }, 0.38)
          // Manos completamente abiertas de alegría
          .to(rightFingers.concat(leftFingers).map(f => f.rotation), { x: -0.25, duration: 0.3 }, 0.40)
          // Piernas extendidas de alegría en el aire
          .to(rightHip.rotation, { x: -0.05, z: -0.22, duration: 0.38, ease: 'power2.out' }, 0.40)
          .to(leftHip.rotation, { x: -0.05, z: 0.22, duration: 0.38, ease: 'power2.out' }, 0.40)
          .to([rightKnee.rotation, leftKnee.rotation], { x: 0.20, duration: 0.38, ease: 'power2.out' }, 0.40)
          .to([rightAnkle.rotation, leftAnkle.rotation], { x: -0.22, duration: 0.38 }, 0.40)

          // Aterrizaje amortiguado del primer salto
          .to(robotRoot.position, { y: 0.18, duration: 0.34, ease: 'power2.in' }, 0.82)
          .to([rightHip.rotation, leftHip.rotation], { x: -0.52, z: (i) => i === 0 ? -0.12 : 0.12, duration: 0.26 }, 0.90)
          .to([rightKnee.rotation, leftKnee.rotation], { x: 0.95, duration: 0.26 }, 0.90)
          .to([rightAnkle.rotation, leftAnkle.rotation], { x: 0.32, duration: 0.26 }, 0.90)
          .to(robotRoot.position, { y: 0.28, duration: 0.2, ease: 'sine.out' }, 1.16);

        // 6. Inclina el torso hacia los lados con entusiasmo (balanceo eufórico izquierda-derecha)
        const swayStart = 1.22;
        for (let s = 0; s < 3; s++) {
          const dir = s % 2 === 0 ? 1 : -1;
          const st = swayStart + s * 0.28;
          tl.to(torsoGroup.rotation, { z: dir * 0.22, x: -0.10, y: dir * 0.14, duration: 0.28, ease: 'sine.inOut' }, st)
            .to(pelvisGroup.rotation, { z: -dir * 0.14, y: -dir * 0.12, duration: 0.28, ease: 'sine.inOut' }, st)
            .to(headGroup.rotation, { z: dir * 0.24, y: dir * 0.15, duration: 0.28, ease: 'sine.inOut' }, st)
            .to(rightShoulder.rotation, { z: -2.25 + dir * 0.28, duration: 0.28, ease: 'sine.inOut' }, st)
            .to(leftShoulder.rotation, { z: 2.25 + dir * 0.28, duration: 0.28, ease: 'sine.inOut' }, st)
            .to(robotRoot.position, { x: dir * 0.14, y: 0.34, duration: 0.14, yoyo: true, repeat: 1, ease: 'sine.inOut' }, st);
        }

        // 7. Realiza dos pequeños saltos consecutivos de euforia
        const hopsStart = swayStart + 3 * 0.28 + 0.04;
        for (let h = 0; h < 2; h++) {
          const ht = hopsStart + h * 0.44;
          const hopDir = h === 0 ? -1 : 1;

          tl.to(robotRoot.position, { y: 0.64, x: hopDir * 0.1, duration: 0.22, ease: 'power2.out' }, ht)
            .to(robotRoot.rotation, { y: hopDir * 0.18, duration: 0.22, ease: 'sine.out' }, ht)
            .to([rightKnee.rotation, leftKnee.rotation], { x: 0.25, duration: 0.20, ease: 'power2.out' }, ht)
            .to([rightAnkle.rotation, leftAnkle.rotation], { x: -0.15, duration: 0.20 }, ht)
            .to(rightShoulder.rotation, { z: -2.55, x: -0.45, duration: 0.22, ease: 'back.out(2)' }, ht)
            .to(leftShoulder.rotation, { z: 2.55, x: -0.45, duration: 0.22, ease: 'back.out(2)' }, ht)
            // Caída suave del salto
            .to(robotRoot.position, { y: 0.18, duration: 0.22, ease: 'power2.in' }, ht + 0.22)
            .to([rightKnee.rotation, leftKnee.rotation], { x: 0.88, duration: 0.22, ease: 'power2.out' }, ht + 0.22)
            .to([rightAnkle.rotation, leftAnkle.rotation], { x: 0.30, duration: 0.22 }, ht + 0.22)
            .to(rightShoulder.rotation, { z: -1.95, duration: 0.22 }, ht + 0.22)
            .to(leftShoulder.rotation, { z: 1.95, duration: 0.22 }, ht + 0.22);
        }

        // 8. Levanta un brazo en señal de victoria + 9. Termina con una pose de celebración divertida
        const victoryTime = hopsStart + 2 * 0.44 + 0.04;
        tl.call(() => spawnCelebrationVFX(0.65), null, victoryTime)
          .to(robotRoot.position, { x: 0, y: 0.32, duration: 0.38, ease: 'back.out(2)' }, victoryTime)
          .to(robotRoot.rotation, { y: 0.12, z: -0.05, duration: 0.38, ease: 'back.out(1.8)' }, victoryTime)
          .to(pelvisGroup.rotation, { z: 0.14, y: -0.14, duration: 0.38, ease: 'back.out(1.8)' }, victoryTime)
          .to(torsoGroup.rotation, { x: -0.16, z: -0.14, y: 0.14, duration: 0.38, ease: 'back.out(1.8)' }, victoryTime)
          .to(headGroup.rotation, { x: -0.14, y: -0.08, z: -0.22, duration: 0.42, ease: 'back.out(2.2)' }, victoryTime)
          // Brazo derecho en todo lo alto con puño de victoria
          .to(rightShoulder.rotation, { x: -0.35, y: 0.1, z: -2.62, duration: 0.42, ease: 'back.out(2.2)' }, victoryTime)
          .to(rightElbow.rotation, { x: -0.25, z: -0.15, duration: 0.38, ease: 'back.out(1.8)' }, victoryTime)
          .to(rightWrist.rotation, { x: 0.1, z: 0.15, duration: 0.35 }, victoryTime)
          .to(rightFingers.map(f => f.rotation), { x: 1.15, z: 0, duration: 0.28, ease: 'power2.out' }, victoryTime + 0.05)
          .to(rightThumb.rotation, { x: 0.45, z: -0.95, duration: 0.28 }, victoryTime + 0.05)
          // Brazo izquierdo flexionado celebrando con energía
          .to(leftShoulder.rotation, { x: -0.35, y: -0.2, z: 0.78, duration: 0.38, ease: 'back.out(1.8)' }, victoryTime)
          .to(leftElbow.rotation, { x: -1.45, y: -0.25, z: 0.22, duration: 0.38, ease: 'back.out(1.8)' }, victoryTime)
          .to(leftFingers.map(f => f.rotation), { x: 1.1, z: 0, duration: 0.28 }, victoryTime + 0.05)
          // Piernas en pose heroica dinámica
          .to(rightHip.rotation, { x: -0.14, z: -0.14, duration: 0.38, ease: 'back.out(1.6)' }, victoryTime)
          .to(rightKnee.rotation, { x: 0.28, duration: 0.38, ease: 'back.out(1.6)' }, victoryTime)
          .to(leftHip.rotation, { x: -0.64, z: 0.18, duration: 0.38, ease: 'back.out(1.6)' }, victoryTime)
          .to(leftKnee.rotation, { x: 1.05, duration: 0.38, ease: 'back.out(1.6)' }, victoryTime)
          .to([leftEye.scale, rightEye.scale], { x: 1.28, y: 1.32, duration: 0.35, ease: 'back.out(2)' }, victoryTime);

        // Volver tranquilamente a su posición de reposo
        appendReturnToRestPose(tl, victoryTime + 0.95, 0.82, 'power2.inOut');
      }

      // Pequeña reacción divertida cuando el usuario hace clic sobre el robot
      function playClickReactionAnimation() {
        stopCurrentAnimation();
        currentState = ROBOT_STATE.REACTING;
        showRobotSpeech('⚡ ¡Jajaja! ¡Eso hace cosquillas cibernéticas! 😄', 2000);

        // Pequeño destello de estrellas al tocarlo
        spawnCelebrationVFX(0.35);

        const tl = gsap.timeline({
          onComplete: () => {
            currentState = ROBOT_STATE.IDLE;
            activeTimeline = null;
          }
        });
        activeTimeline = tl;

        tl.to(animCtrl, { idleWeight: 0, duration: 0.15, ease: 'power2.out' }, 0)
          // Saltito de sorpresa simpática
          .to(robotRoot.position, { y: 0.56, duration: 0.24, ease: 'power2.out' }, 0)
          .to(robotRoot.rotation, { y: 0.04, z: 0.08, duration: 0.24, ease: 'back.out(2)' }, 0)
          .to(torsoGroup.rotation, { x: -0.14, z: -0.12, duration: 0.24, ease: 'back.out(2)' }, 0)
          .to(headGroup.rotation, { x: -0.16, z: 0.26, y: -0.08, duration: 0.26, ease: 'back.out(2.4)' }, 0)
          .to([leftEye.scale, rightEye.scale], { x: 1.35, y: 0.22, duration: 0.15, yoyo: true, repeat: 1 }, 0)
          .to(rightShoulder.rotation, { z: -1.45, x: -0.45, duration: 0.24, ease: 'back.out(2)' }, 0)
          .to(leftShoulder.rotation, { z: 1.45, x: -0.45, duration: 0.24, ease: 'back.out(2)' }, 0)
          .to([rightElbow.rotation, leftElbow.rotation], { x: -1.15, duration: 0.24 }, 0)
          // Aterrizaje y risita corporal (2 pequeños rebotes de hombros y cabeza)
          .to(robotRoot.position, { y: 0.22, duration: 0.26, ease: 'bounce.out' }, 0.24)
          .to(headGroup.rotation, { z: -0.20, x: 0.08, duration: 0.18, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 0.32)
          .to(torsoGroup.position, { y: 0.46, duration: 0.12, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 0.30)
          .to([rightShoulder.rotation, leftShoulder.rotation], {
            x: -0.25,
            duration: 0.12,
            yoyo: true,
            repeat: 3,
            ease: 'sine.inOut'
          }, 0.30);

        appendReturnToRestPose(tl, 0.85, 0.55, 'power2.inOut');
      }

      // ----------------------------------------------------------------------
      // 9. INTERACTION & PUBLIC API (SIN ROMPER FUNCIONES GLOBALES)
      // ----------------------------------------------------------------------
      const pointerTarget = { x: 0, y: 0 };
      const pointerCurrent = { x: 0, y: 0 };
      let lastPointerMoveTime = performance.now();
      let pointerDistanceToCenter = 1.0;
      let buttonLookOverride = null;

      // Miradas autónomas cuando el cursor está inactivo
      const autonomousGaze = {
        yaw: 0,
        pitch: 0,
        roll: 0,
        postureShiftX: 0,
        postureShiftZ: 0,
        timer: 0,
        nextInterval: 2.8
      };
      let blinkTimer = 0;
      let nextBlinkInterval = 3.2;

      window.addEventListener('pointermove', (e) => {
        const nx = (e.clientX / window.innerWidth) * 2 - 1;
        const ny = -(e.clientY / window.innerHeight) * 2 + 1;
        pointerTarget.x = nx;
        pointerTarget.y = ny;
        pointerDistanceToCenter = Math.hypot(nx, ny);
        lastPointerMoveTime = performance.now();
      });

      // Al hacer clic sobre el robot (canvas), reacciona con una animación simpática
      // sin interrumpir bruscamente si ya está ejecutando un baile o celebración
      canvas.addEventListener('pointerdown', () => {
        if (currentState === ROBOT_STATE.IDLE) {
          triggerRobotAction('react');
        }
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function showRobotSpeech(text, duration = 2600) {
        console.log('[Robot]', text);
      }

      function triggerRobotAction(action) {
        if (!robotRoot) return;

        // Evita reiniciar la misma animación si el usuario hace clic repetidamente en el mismo botón activo,
        // pero permite cambiar limpiamente de un botón diferente al otro cancelando la anterior.
        if (action === 'wave') {
          if (currentState === ROBOT_STATE.WAVING) return;
          playWaveAnimation();
        } else if (action === 'dance') {
          if (currentState === ROBOT_STATE.DANCING) return;
          playDanceAnimation();
        } else if (action === 'celebrate') {
          if (currentState === ROBOT_STATE.CELEBRATING) return;
          playCelebrateAnimation();
        } else if (action === 'react') {
          if (currentState !== ROBOT_STATE.IDLE) return;
          playClickReactionAnimation();
        }
      }

      function robotLookAtButton(index, label) {
        const pitchByIndex = [0.22, 0.06, -0.10, -0.26];
        buttonLookOverride = {
          yaw: 0.52,
          pitch: pitchByIndex[index] || 0,
          roll: -0.12
        };
        showRobotSpeech(`Explorando: ${label} ⚡`, 1600);
      }

      function robotResetLook() {
        buttonLookOverride = null;
      }

      // Exponer exactamente las mismas funciones globales para los botones
      window.triggerRobotAction = triggerRobotAction;
      window.robotLookAtButton = robotLookAtButton;
      window.robotResetLook = robotResetLook;

      // Saludo automático al cargar
      setTimeout(() => triggerRobotAction('wave'), 700);

      // ----------------------------------------------------------------------
      // 10. ANIMATION LOOP — PERSONALIDAD AUTOMÁTICA Y VIDA PROCEDURAL
      // ----------------------------------------------------------------------
      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const elapsed = clock.elapsedTime;

        pointerCurrent.x = lerp(pointerCurrent.x, pointerTarget.x, 0.08);
        pointerCurrent.y = lerp(pointerCurrent.y, pointerTarget.y, 0.08);

        const w = animCtrl.idleWeight;
        const timeSincePointer = (performance.now() - lastPointerMoveTime) * 0.001;
        const isPointerActive = timeSincePointer < 3.5;

        // 1. GENERADOR DE CURIOSIDAD Y MIRADAS AUTÓNOMAS EN REPOSO
        autonomousGaze.timer += dt;
        if (autonomousGaze.timer > autonomousGaze.nextInterval) {
          autonomousGaze.timer = 0;
          autonomousGaze.nextInterval = 2.2 + Math.random() * 2.8;

          if (Math.random() < 0.72) {
            // Mirar con curiosidad hacia distintas direcciones e inclinar la cabeza
            autonomousGaze.yaw = (Math.random() - 0.5) * 0.68;
            autonomousGaze.pitch = (Math.random() - 0.45) * 0.32;
            autonomousGaze.roll = (Math.random() - 0.5) * 0.24;
            autonomousGaze.postureShiftX = (Math.random() - 0.5) * 0.06;
            autonomousGaze.postureShiftZ = (Math.random() - 0.5) * 0.05;
          } else {
            // Volver la atención al centro hacia el espectador
            autonomousGaze.yaw = 0.12;
            autonomousGaze.pitch = -0.02;
            autonomousGaze.roll = -0.05;
            autonomousGaze.postureShiftX = 0;
            autonomousGaze.postureShiftZ = 0;
          }
        }

        // 2. MOVIMIENTO PROCEDURAL EN REPOSO (RESPIRACIÓN, CAMBIOS DE POSTURA, MICRO-MOVIMIENTOS)
        if (w > 0.001) {
          // Respiración orgánica multicapa + flotación sutil
          const breathCycle = Math.sin(elapsed * 2.1);
          const secondaryWave = Math.sin(elapsed * 1.15);
          const tertiaryWave = Math.cos(elapsed * 0.75);

          // Cuando el cursor se acerca al robot, reacciona con curiosidad acercándose un poco
          const proximityCuriosity = (isPointerActive && pointerDistanceToCenter < 0.55)
            ? (1 - pointerDistanceToCenter / 0.55)
            : 0;

          const targetRootY = REST_POSE.rootPos.y + breathCycle * 0.085 + proximityCuriosity * 0.04;
          const targetRootX = autonomousGaze.postureShiftX * (1 - proximityCuriosity * 0.5);
          const targetRootZRot = secondaryWave * 0.022 + autonomousGaze.postureShiftZ * 0.5;
          const targetRootYRot = REST_POSE.rootRot.y + tertiaryWave * 0.06 + (isPointerActive ? pointerCurrent.x * 0.12 : 0);

          robotRoot.position.y = lerp(robotRoot.position.y, targetRootY, 0.12 * w);
          robotRoot.position.x = lerp(robotRoot.position.x, targetRootX, 0.05 * w);
          robotRoot.rotation.z = lerp(robotRoot.rotation.z, targetRootZRot, 0.08 * w);
          robotRoot.rotation.y = lerp(robotRoot.rotation.y, targetRootYRot, 0.06 * w);

          // Pelvis y caderas compensan suavemente el peso corporal
          const targetPelvisZ = -secondaryWave * 0.035 + autonomousGaze.postureShiftZ;
          const targetPelvisY = tertiaryWave * 0.05;
          pelvisGroup.rotation.z = lerp(pelvisGroup.rotation.z, targetPelvisZ, 0.08 * w);
          pelvisGroup.rotation.y = lerp(pelvisGroup.rotation.y, targetPelvisY, 0.08 * w);

          // Torso simula respiración (expansión de pecho al inhalar) + reacción al cursor
          const breathPitch = -breathCycle * 0.035 + proximityCuriosity * 0.08;
          const torsoYawTarget = isPointerActive
            ? pointerCurrent.x * 0.18
            : autonomousGaze.yaw * 0.25;
          const torsoPitchTarget = isPointerActive
            ? (-pointerCurrent.y * 0.09 + breathPitch)
            : (autonomousGaze.pitch * 0.2 + breathPitch);

          torsoGroup.rotation.y = lerp(torsoGroup.rotation.y, torsoYawTarget, 0.07 * w);
          torsoGroup.rotation.x = lerp(torsoGroup.rotation.x, torsoPitchTarget, 0.07 * w);
          torsoGroup.rotation.z = lerp(torsoGroup.rotation.z, secondaryWave * 0.025, 0.07 * w);

          // Seguimiento de cabeza y cuello (cursor activo vs curiosidad autónoma)
          let targetYaw, targetPitch, targetRoll;
          if (buttonLookOverride) {
            targetYaw = buttonLookOverride.yaw;
            targetPitch = buttonLookOverride.pitch;
            targetRoll = buttonLookOverride.roll;
          } else if (isPointerActive) {
            targetYaw = 0.10 + pointerCurrent.x * 0.48;
            targetPitch = -pointerCurrent.y * 0.30;
            // Inclinación simpática de cabeza cuando el cursor se acerca al centro
            targetRoll = -0.05 - pointerCurrent.x * 0.10 - proximityCuriosity * 0.14;
          } else {
            targetYaw = autonomousGaze.yaw + Math.sin(elapsed * 0.9) * 0.05;
            targetPitch = autonomousGaze.pitch + Math.cos(elapsed * 1.3) * 0.04;
            targetRoll = autonomousGaze.roll + Math.sin(elapsed * 1.1) * 0.05;
          }

          headGroup.rotation.y = lerp(headGroup.rotation.y, targetYaw, 0.11 * w);
          headGroup.rotation.x = lerp(headGroup.rotation.x, targetPitch, 0.11 * w);
          headGroup.rotation.z = lerp(headGroup.rotation.z, targetRoll, 0.11 * w);
          neckGroup.rotation.y = lerp(neckGroup.rotation.y, targetYaw * 0.2, 0.08 * w);
          neckGroup.rotation.x = lerp(neckGroup.rotation.x, breathCycle * 0.02, 0.08 * w);

          // Ligero balanceo natural de hombros, codos y muñecas con la respiración
          rightShoulder.position.y = lerp(rightShoulder.position.y, 0.34 + breathCycle * 0.014, 0.1 * w);
          leftShoulder.position.y = lerp(leftShoulder.position.y, 0.34 + breathCycle * 0.014, 0.1 * w);

          rightShoulder.rotation.z = lerp(
            rightShoulder.rotation.z,
            REST_POSE.rShoulderRot.z - breathCycle * 0.035 - proximityCuriosity * 0.06,
            0.08 * w
          );
          rightShoulder.rotation.x = lerp(
            rightShoulder.rotation.x,
            REST_POSE.rShoulderRot.x + Math.cos(elapsed * 1.5) * 0.04,
            0.08 * w
          );
          rightElbow.rotation.x = lerp(
            rightElbow.rotation.x,
            REST_POSE.rElbowRot.x + Math.sin(elapsed * 1.8) * 0.05 - proximityCuriosity * 0.12,
            0.08 * w
          );
          rightWrist.rotation.z = lerp(
            rightWrist.rotation.z,
            Math.sin(elapsed * 2.2) * 0.06,
            0.1 * w
          );

          leftShoulder.rotation.z = lerp(
            leftShoulder.rotation.z,
            REST_POSE.lShoulderRot.z + breathCycle * 0.035 + proximityCuriosity * 0.06,
            0.08 * w
          );
          leftShoulder.rotation.x = lerp(
            leftShoulder.rotation.x,
            REST_POSE.lShoulderRot.x + Math.sin(elapsed * 1.4) * 0.04,
            0.08 * w
          );
          leftElbow.rotation.x = lerp(
            leftElbow.rotation.x,
            REST_POSE.lElbowRot.x + Math.cos(elapsed * 1.9) * 0.05,
            0.08 * w
          );
          leftWrist.rotation.x = lerp(
            leftWrist.rotation.x,
            REST_POSE.lWristRot.x + Math.sin(elapsed * 2.6) * 0.08,
            0.1 * w
          );

          // Movimientos discretos y orgánicos de los dedos en ambas manos
          rightFingers.forEach((f, idx) => {
            const curl = Math.sin(elapsed * 2.8 + idx * 0.65) * 0.12 + 0.08;
            f.rotation.x = lerp(f.rotation.x, curl, 0.12 * w);
          });
          leftFingers.forEach((f, idx) => {
            const curl = Math.sin(elapsed * 3.1 + idx * 0.7 + 1.2) * 0.14 + 0.10;
            f.rotation.x = lerp(f.rotation.x, curl, 0.12 * w);
          });

          // Flexión sutil de rodillas y tobillos para mantener equilibrio vivo
          rightKnee.rotation.x = lerp(
            rightKnee.rotation.x,
            REST_POSE.rKneeRot.x - breathCycle * 0.04,
            0.1 * w
          );
          leftKnee.rotation.x = lerp(
            leftKnee.rotation.x,
            REST_POSE.lKneeRot.x + breathCycle * 0.045,
            0.1 * w
          );
          rightAnkle.rotation.x = lerp(
            rightAnkle.rotation.x,
            REST_POSE.rAnkleRot.x + breathCycle * 0.02,
            0.1 * w
          );
          leftAnkle.rotation.x = lerp(
            leftAnkle.rotation.x,
            REST_POSE.lAnkleRot.x - breathCycle * 0.02,
            0.1 * w
          );
        }

        // 3. SEGUIMIENTO OCULAR EXPRESIVO Y PARPADEO NATURAL (INCLUYE DOBLE PARPADEO OCASIONAL)
        if (leftEye && rightEye) {
          const lookX = isPointerActive ? pointerCurrent.x : (autonomousGaze.yaw * 1.1);
          const lookY = isPointerActive ? pointerCurrent.y : (-autonomousGaze.pitch * 1.2);
          const eyeOffsetX = clamp(lookX * 0.075, -0.085, 0.085);
          const eyeOffsetY = clamp(lookY * 0.055, -0.065, 0.065);

          leftEye.position.x = lerp(leftEye.position.x, -0.26 + eyeOffsetX, 0.18);
          leftEye.position.y = lerp(leftEye.position.y, -0.02 + eyeOffsetY, 0.18);
          rightEye.position.x = lerp(rightEye.position.x, 0.26 + eyeOffsetX, 0.18);
          rightEye.position.y = lerp(rightEye.position.y, -0.02 + eyeOffsetY, 0.18);
        }

        blinkTimer += dt;
        if (blinkTimer > nextBlinkInterval && currentState === ROBOT_STATE.IDLE) {
          blinkTimer = 0;
          nextBlinkInterval = 2.4 + Math.random() * 2.8;
          const isDoubleBlink = Math.random() < 0.28;

          gsap.to([leftEye.scale, rightEye.scale], {
            y: 0.06,
            x: 1.08,
            duration: 0.075,
            yoyo: true,
            repeat: isDoubleBlink ? 3 : 1,
            ease: 'power2.inOut'
          });
        }

        // 4. ACTUALIZAR PARTÍCULAS AMBIENTALES Y EFECTOS FÍSICOS DE CELEBRACIÓN
        if (particleSystem) {
          particleSystem.rotation.y = elapsed * 0.08;
          particleSystem.position.y = Math.sin(elapsed * 0.9) * 0.12;
        }

        updateCelebrationVFX(dt, elapsed);

        renderer.render(scene, camera);
      }

      animate();
    })();
  </script>
</body>
</html>
